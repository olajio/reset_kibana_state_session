---
# Inventory for playbooks/reset_kibana_state_session.yml.
#
# The playbook runs on the `appserver` group: the host with the IAM role that
# can read the agency_*_store / federal_store secrets, and network access to
# every deployment's Kibana. It runs the script there, not on the AAP node.
#
# In AAP, the simplest option is to reuse the inventory your other Kibana
# toolkits (e.g. Cleanup Duplicate Data Views) already use, as long as it has an
# `appserver` group. Use this file only if you need a separate inventory: in AAP
# add it as an inventory source "Sourced from a Project", file
# inventory/hosts.yml (see docs/aap-setup.md).
#
# SSH user, key and sudo come from the AAP Machine credential, not from here.

all:
  children:
    appserver:
      hosts:
        # Replace with the appserver's real hostname or IP address.
        appserver.example.gov:
